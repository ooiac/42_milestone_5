  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

% 8%,100% 34%,100% 64%,78% 92%,50% 100%,22% 92%,0% 64%,0% 34%,12% 8%);background:#002776;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden\">\n            <div style=\"position:absolute;top:0;bottom:0;left:44%;width:12%;background:#009c3b\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;top:44%;height:12%;background:#009c3b\"><\u002Fdiv>\n            <div style=\"width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#dfe7f5 70%);position:relative;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,0.3)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#009c3b;padding:4px 22px;border-radius:2px;box-shadow:0 4px 10px rgba(0,0,0,0.3)\">\n          <span style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;letter-spacing:0.14em;color:#ffdf00\">BRASIL<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px\">\n        <sc-for list=\"{{ hexaStars }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <span style=\"{{ s.style }}\">★<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-family:'Archivo',sans-serif;font-size:15px;color:#cfe0ff;margin:0\">penta conquistado. hexa a caminho.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;},\n  &quot;defaultLang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;en&quot;, &quot;options&quot;: [&quot;en&quot;, &quot;pt&quot;, &quot;fr&quot;], &quot;tsType&quot;: &quot;'en'|'pt'|'fr'&quot;, &quot;section&quot;: &quot;Content&quot;},\n  &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1F6F4A&quot;, &quot;options&quot;: [&quot;#1F6F4A&quot;, &quot;#2E7D32&quot;, &quot;#3C6E47&quot;, &quot;#175C4C&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;},\n  &quot;defaultDarkMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Theme&quot;}\n}\">\nconst REPOS = [\n  { name: '42_milestone_0', lang: 'C', url: 'https://github.com/ooiac/42_milestone_0',\n    desc: { en: 'Libft: a C standard library rebuilt from scratch, string handling, memory functions, and a linked list. Every later project links against it.',\n            pt: 'Libft: uma biblioteca C refeita do zero, com manipulação de strings, funções de memória e lista encadeada. Todo projeto seguinte depende dela.',\n            fr: \"Libft : une bibliothèque C reconstruite de zéro, avec chaînes de caractères, fonctions mémoire et liste chaînée. Chaque projet suivant s'appuie dessus.\" } },\n  { name: '42_milestone_1', lang: 'C', url: 'https://github.com/ooiac/42_milestone_1',\n    desc: { en: 'get_next_line and ft_printf: reading a file one line at a time, and a from-scratch, variadic printf.',\n            pt: 'get_next_line e ft_printf: ler um arquivo linha por linha, e um printf refeito do zero, com argumentos variádicos.',\n            fr: \"get_next_line et ft_printf : lire un fichier ligne par ligne, et un printf variadique reconstruit de zéro.\" } },\n  { name: '42_milestone_2', lang: 'C', url: 'https://github.com/ooiac/42_milestone_2',\n    desc: { en: 'push_swap and minitalk: sorting a stack in the fewest moves possible, then passing data between two processes with nothing but UNIX signals.',\n            pt: 'push_swap e minitalk: ordenar uma pilha com o menor número possível de movimentos, depois trocar dados entre dois processos só com sinais UNIX.',\n            fr: \"push_swap et minitalk : trier une pile en un minimum de mouvements, puis faire communiquer deux processus uniquement avec des signaux UNIX.\" } },\n  { name: '42_milestone_3', lang: 'C', url: 'https://github.com/ooiac/42_milestone_3',\n    desc: { en: 'Philosophers and minishell: the dining philosophers problem with threads and mutexes, and a shell that actually runs commands.',\n            pt: 'Philosophers e minishell: o problema dos filósofos com threads e mutexes, e um shell que roda comandos de verdade.',\n            fr: \"Philosophers et minishell : le problème des philosophes avec threads et mutex, et un shell qui exécute de vraies commandes.\" } },\n  { name: '42_milestone_4', lang: 'C', url: 'https://github.com/ooiac/42_milestone_4',\n    desc: { en: 'NetPractice and cub3D: subnetting drills, then a raycasting engine that turns a 2D map into a first-person 3D maze.',\n            pt: 'NetPractice e cub3D: exercícios de sub-rede e um motor de raycasting que transforma um mapa 2D em um labirinto 3D em primeira pessoa.',\n            fr: \"NetPractice et cub3D : des exercices de sous-réseaux, puis un moteur de raycasting qui transforme une carte 2D en un labyrinthe 3D en vue subjective.\" } },\n  { name: 'oiac', lang: null, url: 'https://github.com/ooiac/oiac',\n    desc: { en: 'The profile readme behind this site: campus, languages, stack, and the running split between terminal and camera.',\n            pt: 'O readme de perfil por trás deste site: campus, idiomas, stack, e a divisão constante entre o terminal e a câmera.',\n            fr: \"Le readme de profil derrière ce site : campus, langues, stack, et le partage constant entre le terminal et la caméra.\" } },\n];\n\n// A couple of sliding-marker touches (one \"/\", one \"_\"), spread through the\n// sentence, original case preserved. Just a light accent, not a whole block.\nfunction coverOnce(text) {\n  const words = text.split(' ').filter(Boolean);\n  if (words.length < 3) return text + '/';\n  const p1 = Math.max(1, Math.round(words.length / 3));\n  const p2 = Math.min(words.length - 1, Math.max(p1 + 1, Math.round((words.length * 2) / 3)));\n  const out = words.slice();\n  out[p1 - 1] = out[p1 - 1] + '/';\n  out[p2 - 1] = out[p2 - 1] + '_';\n  return out.join(' ');\n}\n\n// Repeats a phrase across several lines with a \"/\" or \"_\" marker sliding one\n// word further each line — the scattered slash/underscore lettering some\n// album sleeves use, applied here to our own Radiohead-mode copy only.\nfunction coverSlideLines(sentence) {\n  const words = sentence.replace(/[.,]/g, '').split(' ').filter(Boolean);\n  const n = words.length;\n  if (n < 2) return [sentence];\n  const count = Math.min(4, n - 1);\n  const markers = ['/', '_', '/', '_'];\n  const lines = [];\n  for (let i = 0; i < count; i++) {\n    const pos = 1 + Math.round((i * (n - 1)) / count);\n    const left = words.slice(0, pos).join(' ');\n    const right = words.slice(pos).join(' ');\n    lines.push(`${left}${markers[i % markers.length]} ${right}`.replace(/\\s+/g, ' ').trim());\n  }\n  return lines;\n}\n\nconst DICT = {\n  en: {\n    nav: { audiovisual: 'Audiovisual', code: 'Code' },\n    hero: {\n      eyebrow: '$ whoami', name: 'Oiac', handle: '@ooiac',\n      line1: 'software engineering student',\n      location: 'Luxembourg', scroll: 'Scroll',\n    },\n    av: {\n      eyebrow: '01 — Audiovisual', heading: 'Video work',\n      sub: 'POV clips of things worth stopping for, posted to my YouTube channel.',\n      cta: 'Watch on YouTube', captionFeatured: 'Featured video', caption: 'Video',\n      placeholder: 'drop a thumbnail',\n      shortsCaption: 'Shorts', shortsPlaceholder: 'drop a shorts thumbnail',\n    },\n    code: {\n      eyebrow: '02 — Code', heading: 'GitHub projects',\n      sub: 'Coursework from 42 School, a project-based, peer-reviewed coding school, plus a couple of personal repos.',\n      cta: 'View profile on GitHub', viewRepo: 'View repo', noDesc: 'No description yet.', bonus: 'Bonus',\n    },\n    menu: { language: 'Language', theme: 'Theme', light: 'Light', dark: 'Dark' },\n    footer: { rights: '© 2026 Oiac.' },\n  },\n  pt: {\n    nav: { audiovisual: 'Audiovisual', code: 'Código' }, bonus: 'Bonus',\n    },\n    menu: { language: 'Langue', theme: 'Thème', light: 'Clair', dark: 'Sombre' },\n    footer: { rights: '© 2026 Oiac.' },\n  },\n};\n\n// Brazil-mode copy: original World-Cup-vibe phrasing, not tied to a specific\n// club or chant, just genuine torcida energy — replaces the normal copy\n// wherever this mode is active, regardless of language selected.\nconst BR_COPY = {\n  nav: { audiovisual: 'Jogadas', code: 'Seleção' },\n  hero: {\n    eyebrow: '$ bora_copa', name: 'Oiac',\n    line1: 'convocado pra seleção/ de software',\n    location: 'Luxemburgo, torcendo de longe', scroll: 'Desce',\n  },\n  av: {\n    eyebrow: '01 — JOGADAS', heading: 'Golaço',\n    sub: 'Lances que renderam replay, publicados no canal do youtube pra torcida.',\n    cta: 'Ver de novo', captionFeatured: 'Melhor momento', caption: 'Lance',\n    placeholder: 'solta a imagem aqui, é gol',\n    shortsCaption: 'Compacto', shortsPlaceholder: 'solta o compacto aqui',\n  },\n  code: {\n    eyebrow: '02 — SELEÇÃO', heading: 'Seleção titular',\n    sub: 'Cada milestone da 42 é uma fase da copa vencida. Convocação por ordem de chegada.',\n    cta: 'Ver a ficha completa', viewRepo: 'Ver a jogada', bonus: 'Reserva',\n  },\n  footer: { rights: '© 2026 Oiac. É campeão.' },\n};\n\n// Radiohead-mode copy: original, mood-matching phrasing inspired by the\n// records' themes (static, distance, machines) — never a reproduction of\n// actual lyrics, just our own words in that register.\nconst RH_COPY = {\n  nav: { audiovisual: 'Frequência', code: 'Sinal' },\n  hero: {\n    eyebrow: '$ ping localhost', name: 'Oiac',\n    line1: 'a voice that sounds like static/ trying to be a person',\n    location: 'somewhere between luxembourg and the feed', scroll: 'drift',\n  },\n  av: {\n    eyebrow: '01 — FREQUÊNCIA', heading: 'Signal, not noise',\n    sub: 'Small transmissions, recorded and sent out, hoping something on the other end is listening.',\n    cta: 'tune in', captionFeatured: 'Let Down', caption: 'Track',\n    placeholder: 'drop the footage in the static',\n    shortsCaption: 'B-side', shortsPlaceholder: 'drop the footage in the static',\n  },\n  code: {\n    eyebrow: '02 — SINAL', heading: 'Fitter, compiled, happier',\n    sub: 'Every function here was a small machine built to feel less like one.',\n    cta: 'inspect the wiring', viewRepo: 'open the file', bonus: 'B-side',\n  },\n  footer: { rights: '© 2026 Oiac. everything in its right place, mostly.' },\n};\n\nconst LANG_META = {\n  en: { label: 'EN', name: 'English' },\n  pt: { label: 'PT', name: 'Português' },\n  fr: { label: 'FR', name: 'Français' },\n};\n\nclass Component extends DCLogic {\n  state = {\n    lang: (this.props.defaultLang || 'en'),\n    activeSection: 'hero',\n    menuOpen: false,\n    darkMode: this.props.defaultDarkMode ?? false,\n    showClapper: false,\n    showMatrix: false,\n    heroTyped: 0,\n    avRevealed: false,\n    codeRevealed: false,\n    matrixFading: false,\n    mode: 'off',\n    soccerBalls: [],\n    confetti: [],\n    hexaStarsShown: 0,\n  };\n\n  _setMatrixCanvasRef = (el) => { this._matrixCanvasEl = el; };\n  _setStaticCanvasRef = (el) => { this._staticCanvasEl = el; };\n\n  _startStatic() {\n    const canvas = this._staticCanvasEl;\n    if (!canvas) return;\n    const ctx = canvas.getContext('2d');\n    const w = 160, h = 100;\n    canvas.width = w;\n    canvas.height = h;\n    const draw = () => {\n      const imgData = ctx.createImageData(w, h);\n      const buf = imgData.data;\n      for (let i = 0; i < buf.length; i += 4) {\n        const v = (Math.random() * 255) | 0;\n        buf[i] = v; buf[i + 1] = v; buf[i + 2] = v; buf[i + 3] = 255;\n      }\n      ctx.putImageData(imgData, 0, 0);\n      this._staticRaf = requestAnimationFrame(draw);\n    };\n    draw();\n  }\n\n  _stopStatic() {\n    if (this._staticRaf) cancelAnimationFrame(this._staticRaf);\n    this._staticRaf = null;\n  }\n\n  _randomSoccerBalls(count) {\n    const w = window.innerWidth || 1200;\n    const h = window.innerHeight || 800;\n    const balls = [];\n    for (let i = 0; i < count; i++) {\n      const size = 32 + Math.round(Math.random() * 20);\n      balls.push({\n        size,\n        x: Math.random() * Math.max(1, w - size),\n        y: Math.random() * Math.max(1, h - size),\n        vx: (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 1.6),\n        vy: (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 1.6),\n      });\n    }\n    return balls;\n  }\n\n  _startBallPhysics() {\n    clearInterval(this._ballInterval);\n    this._ballInterval = setInterval(() => {\n      const w = window.innerWidth || 1200;\n      const h = window.innerHeight || 800;\n      this.setState((s) => ({\n        soccerBalls: s.soccerBalls.map((b) => {\n          let { x, y, vx, vy, size } = b;\n          x += vx; y += vy;\n          if (x <= 0 || x >= w - size) { vx = -vx; x = Math.max(0, Math.min(w - size, x)); }\n          if (y <= 0 || y >= h - size) { vy = -vy; y = Math.max(0, Math.min(h - size, y)); }\n          return { ...b, x, y, vx, vy };\n        }),\n      }));\n    }, 90);\n  }\n\n  _stopBallPhysics() {\n    clearInterval(this._ballInterval);\n  }\n\n  _randomConfetti(count) {\n    const colors = ['#009c3b', '#ffdf00', '#002776', '#ffffff'];\n    const pieces = [];\n    for (let i = 0; i < count; i++) {\n      pieces.push({\n        style: `position:absolute;top:-24px;left:${Math.round(Math.random() * 100)}%;width:${6 + Math.round(Math.random() * 6)}px;height:${10 + Math.round(Math.random() * 8)}px;background:${colors[i % colors.length]};transform:rotate(${Math.round(Math.random() * 360)}deg);animation:confettiFall ${1.1 + Math.random() * 0.8}s ease-in ${Math.random() * 0.3}s forwards;pointer-events:none`,\n      });\n    }\n    return pieces;\n  }\n\n  // setTimeout chain rather than setInterval: each tick schedules the next one\n  // only after applying, so there's no risk of overlapping timers from a\n  // second setMode() call (double-click, quick mode-swap) landing on top of a\n  // stale interval id and fighting over the same state key.\n  _advanceHexa() {\n    this._hexaCount = Math.min((this._hexaCount || 0) + 1, 6);\n    this.setState({ hexaStarsShown: this._hexaCount });\n    if (this._hexaCount < 6) {\n      this._hexaTimeout = setTimeout(() => this._advanceHexa(), 220);\n    }\n  }\n\n  setMode(mode) {\n    clearTimeout(this._hexaTimeout);\n    this._stopBallPhysics();\n    if (mode === 'brazil') {\n      this._hexaCount = 0;\n      this.setState({ mode, soccerBalls: this._randomSoccerBalls(4), hexaStarsShown: 0 });\n      this._startBallPhysics();\n      this._hexaTimeout = setTimeout(() => this._advanceHexa(), 220);\n    } else {\n      this.setState({ mode });\n    }\n  }\n\n  componentDidMount() {\n    // Scroll-driven section tracking: which section is \"active\" (for the nav underline)\n    // plus repeatable boundary-crossing transitions (clapperboard between Hero/Audiovisual,\n    // matrix rain between Audiovisual/Code) — fires every crossing, either direction.\n    // Uses rect math on a rAF-throttled scroll handler rather than IntersectionObserver.\n    this._userScrolled = false;\n    this._tickScheduled = false;\n    this._onScroll = () => {\n      this._userScrolled = true;\n      if (this._tickScheduled) return;\n      this._tickScheduled = true;\n      requestAnimationFrame(() => { this._tickScheduled = false; this._handleScroll(); });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n\n    // If the page loads already scrolled past a section (deep link, refresh),\n    // reveal its content immediately instead of leaving it permanently blank\n    // waiting for a boundary crossing that will never happen.\n    // Deferred a frame so layout (section heights etc.) has fully settled —\n    // reading rects synchronously in componentDidMount was racy and could\n    // misjudge the initial section on first paint.\n    requestAnimationFrame(() => {\n      const vh0 = window.innerHeight || 800;\n      let initialActive = 'hero';\n      ['hero', 'audiovisual', 'code'].forEach((id) => {\n        const el = document.getElementById(id);\n        if (!el) return;\n        if (el.getBoundingClientRect().top <= vh0 * 0.5) initialActive = id;\n      });\n      const initialState = { activeSection: initialActive, avRevealed: false, codeRevealed: false };\n      if (initialActive === 'audiovisual' || initialActive === 'code') initialState.avRevealed = true;\n      if (initialActive === 'code') initialState.codeRevealed = true;\n      this.setState(initialState);\n      this._lastScrollY = window.scrollY;\n    });\n\n    // Terminal-style typewriter for the hero name, once on load.\n    const fullName = DICT.en.hero.name;\n    this._typeStartTimeout = setTimeout(() => {\n      this._typeInterval = setInterval(() => {\n        this.setState((s) => {\n          const next = Math.min((s.heroTyped || 0) + 1, fullName.length);\n          if (next >= fullName.length) clearInterval(this._typeInterval);\n          return { heroTyped: next };\n        });\n      }, 110);\n    }, 350);\n  }\n\n  _handleScroll() {\n    const vh = window.innerHeight || 800;\n    const scrollY = window.scrollY;\n    const goingDown = scrollY >= (this._lastScrollY ?? scrollY);\n    this._lastScrollY = scrollY;\n    // Monotonic scrollspy with directional hysteresis: crossing into a section\n    // requires its top past 55% of the viewport when scrolling down, or past\n    // 45% when scrolling up. The ~10%-viewport dead zone between those two\n    // lines is what stops the active section (and its transition) from\n    // flickering back and forth when the scroll position hovers near a\n    // boundary — a single shared threshold would trigger repeatedly there.\n    const threshold = goingDown ? vh * 0.55 : vh * 0.45;\n    let active = 'hero';\n    ['hero', 'audiovisual', 'code'].forEach((id) => {\n      const el = document.getElementById(id);\n      if (!
