server {
    listen 8080;
    server_name localhost webserv.local;
    client_max_body_size 10M;

    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 501 /errors/501.html;

    location / {
        root ./www;
        index index.html;
        methods GET HEAD POST DELETE;
        autoindex off;
    }

    location /upload/ {
        methods POST GET HEAD DELETE;
        root ./www/upload;
        upload_path ./www/upload;
        autoindex on;
    }

    location /cgi-bin/ {
        methods GET HEAD POST;
        root ./cgi-bin;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
        cgi .sh /bin/bash;
        autoindex off;
    }

    location /redirect/ {
        return 301 http://localhost:8080/;
    }

    location /errors/ {
        root ./www/errors;
        methods GET HEAD;
        autoindex off;
    }
}

server {
    listen 8081;
    server_name localhost;
    client_max_body_size 1M;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        root ./www;
        index index.html;
        methods GET HEAD;
        autoindex on;
    }

    location /errors/ {
        root ./www/errors;
        methods GET HEAD;
        autoindex off;
    }
}
